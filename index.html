<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erkezhan</title>
<meta name="description" content="Приглашение на день рождения. 4 октября 2026, 18:00–21:00.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

<!-- ==========================================================
     ВСЁ, ЧТО МОЖНО МЕНЯТЬ — ТОЛЬКО В ЭТОМ БЛОКЕ
     Тексты, ссылки, дата, фотографии.
     ========================================================== -->
<script>
const CONTENT = {

  /* --- Стартовый экран: картинка конверта --- */
  envelope: "images/envelope.png",
  envelopeHint: "нажмите, чтобы открыть",

  /* --- Музыка --- */
  musicFile: "music/dancing-queen.mp3",
  musicOn:  "Музыка: ВКЛ",
  musicOff: "Музыка: ВЫКЛ",

  /* --- Шапка --- */
  name: "Erkezhan",
  heroPhoto: "images/hero.jpg",     /* фото 16:9 */
  occasion: "День рождения",
  dateLine: "4 октября 2026 • 18:00–21:00",

  /* --- Обратный отсчёт --- */
  countdownTitle: "До праздника осталось",
  /* формат: год-месяц-деньTчасы:минуты+05:00 (Астана) */
  countdownTarget: "2026-10-04T18:00:00+05:00",
  countdownDone: "Уже начали",
  countdownLabels: { days: "дней", hours: "часов", minutes: "минут", seconds: "секунд" },

  /* --- Место проведения --- */
  placeTitle: "Место проведения",
  placeName: "[НАЗВАНИЕ МЕСТА]",
  /* фото места — идут друг под другом одним коллажем.
     Можно добавлять и убирать строки; ненайденные файлы просто не покажутся */
  placePhotos: [
    "images/place1.jpg",
    "images/place2.jpg",
    "images/place3.jpg"
  ],
  mapButton: "Открыть в 2GIS",
  mapUrl: "https://2gis.kz/astana/geo/70000001080819861",
  chatButton: "Чат",
  chatUrl: "[ССЫЛКА НА ЧАТ]",

  /* --- Программа --- */
  programTitle: "Программа",
  program: [
    "18:00 • Собираемся",
    "19:00 • Мастер-класс по рисованию",
    "21:00 • Расходимся"
  ],

  /* --- Dress Code --- */
  dressTitle: "Dress Code",
  dressLines: [
    "Total white • Любой фасон"
  ],

  /* --- С собой --- */
  bringTitle: "С собой",
  bringText: "Хорошее настроение и улыбку :)",

  /* --- Ссылка внизу --- */
  siteLabel: "Мой сайт",
  siteUrl: "[ССЫЛКА НА САЙТ]"
};
</script>
<!-- ===================== КОНЕЦ НАСТРОЕК ===================== -->

<style>
:root{
  --rose:#FBEFF2;         /* основной фон */
  --rose-deep:#F5E1E8;    /* фон секций countdown и dress code */
  --accent:#C77E95;       /* тёмно-розовый: кнопка 2GIS */
  --accent-soft:#EFC5D2;  /* светло-розовый: кнопка «Чат» */
  --ink:#4A2F36;          /* заголовки */
  --muted:#A2707F;        /* подписи */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Cormorant Garamond', Georgia, serif;
  background:var(--rose);
  color:var(--ink);
  text-align:center;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:100%}

h1,h2{font-family:'Playfair Display', Georgia, serif;letter-spacing:2px;margin:0}
h2{font-size:34px;font-weight:600;color:var(--ink)}

/* ================== КОНВЕРТ ================== */
#gate{
  position:fixed;inset:0;z-index:50;
  background:var(--rose);   /* только фон страницы, ничего за конвертом */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:30px;padding:28px;
  transition:opacity .6s ease, visibility .6s;
}
#gate.opened{opacity:0;visibility:hidden;pointer-events:none}
/* сцена: карточка лежит ПОЗАДИ конверта */
.stage{position:relative;width:min(76vw,340px);background:transparent}

#envelope{
  position:relative;z-index:2;
  border:0;padding:0;margin:0;background:transparent;cursor:pointer;
  width:100%;line-height:0;
  -webkit-appearance:none;appearance:none;
  box-shadow:none;border-radius:0;
  -webkit-tap-highlight-color:transparent;
  animation:pulse 3s ease-in-out infinite;
  will-change:transform,opacity;
  /* тень повторяет контур конверта, а не прямоугольник картинки */
  filter:drop-shadow(0 18px 26px rgba(160,100,120,.28));
}
#envelope img{
  width:100%;height:auto;display:block;
  background:transparent;border:0;border-radius:0;box-shadow:none;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#envelope:focus-visible{outline:1px solid var(--accent);outline-offset:16px}

/* 1. покачивание в момент клика */
.stage.shake #envelope{animation:shake .4s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  0%{transform:rotate(0) translateX(0)}
  15%{transform:rotate(-2.4deg) translateX(-5px)}
  35%{transform:rotate(2.2deg) translateX(5px)}
  55%{transform:rotate(-1.6deg) translateX(-3px)}
  75%{transform:rotate(1.2deg) translateX(2px)}
  100%{transform:rotate(0) translateX(0)}
}

/* 3. конверт уезжает вниз */
.stage.drop #envelope{
  animation:none;
  transform:translateY(62%) rotate(1.5deg);
  opacity:0;
  transition:transform .75s cubic-bezier(.4,0,.2,1), opacity .65s cubic-bezier(.4,0,.2,1);
}

/* 2. открытка выезжает из конверта */
.letter{
  position:absolute;z-index:1;
  left:9%;right:9%;bottom:7%;height:78%;
  border-radius:14px;
  background:linear-gradient(170deg,#FFFFFF 0%, var(--rose) 55%, var(--rose-deep) 100%);
  box-shadow:0 16px 40px rgba(160,100,120,.22);
  display:flex;align-items:center;justify-content:center;
  transform:translateY(0) scale(1);
  transform-origin:50% 50%;
  will-change:transform,opacity;
  transition:transform .85s cubic-bezier(.22,1,.36,1);
}
.letter span{
  font-family:'Allura',cursive;font-size:clamp(26px,9vw,40px);
  color:var(--ink);letter-spacing:1px;line-height:1;opacity:0;
  transition:opacity .5s ease .25s;
}
.stage.slide .letter{transform:translateY(-62%) scale(1)}
.stage.slide .letter span{opacity:1}

/* 4. карточка раскрывается на весь экран */
.stage.expand .letter{
  transition:transform .85s cubic-bezier(.65,0,.35,1), opacity .55s ease .3s;
  transform:translateY(-62%) scale(var(--k,8));
  opacity:0;
}
.stage.expand .letter span{opacity:0;transition:opacity .3s ease}
#gate.fading .hint{opacity:0;transition:opacity .35s ease}
.hint{
  font-size:15px;letter-spacing:3px;color:var(--muted);margin:0;
  animation:fadeHint 3s ease-in-out infinite;
}
@keyframes fadeHint{0%,100%{opacity:.5}50%{opacity:1}}

/* ================== МУЗЫКА ================== */
.music-bar{padding:20px 22px 0}
#music-toggle{
  display:block;width:100%;max-width:430px;margin:0 auto;
  font-family:'Cormorant Garamond', Georgia, serif;
  font-size:17px;letter-spacing:2px;color:var(--ink);
  background:var(--rose-deep);
  border:1px solid var(--accent-soft);border-radius:40px;
  padding:15px 24px;cursor:pointer;transition:.3s ease;
}
#music-toggle:hover{background:var(--accent-soft)}

/* ================== СТРАНИЦА ================== */
main{opacity:0;transition:opacity .8s ease}
main.visible{opacity:1}
main[hidden]{display:none}

section{padding:80px 22px}
.wrap{max-width:430px;margin:0 auto}
.tone{background:var(--rose-deep)}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ---- шапка ---- */
.hero{padding-top:110px;padding-bottom:80px}
.hero h1{font-family:'Allura',cursive;font-size:74px;font-weight:400;letter-spacing:2px;line-height:1.1;color:var(--ink)}
.hero-img{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  margin-top:38px;border-radius:14px;
  background:var(--rose-deep);
  box-shadow:0 26px 60px rgba(160,100,120,.25);
}
.occasion{margin:34px 0 0;font-size:24px;letter-spacing:4px;color:var(--muted)}
.date{margin:20px 0 0;font-size:18px;letter-spacing:2px;color:var(--ink)}

/* ---- отсчёт ---- */
.countdown{display:flex;flex-direction:column;gap:18px;margin-top:40px}
.countdown div{
  background:var(--rose);border-radius:14px;padding:26px 20px;
  box-shadow:0 16px 38px rgba(160,100,120,.16);
}
.countdown span{
  display:block;font-family:'Playfair Display',serif;font-weight:600;
  font-size:34px;color:var(--accent);font-variant-numeric:tabular-nums;
}
.countdown p{margin:12px 0 0;font-size:15px;letter-spacing:3px;color:var(--muted)}
.countdown-done{font-size:26px;letter-spacing:3px;color:var(--accent);margin:38px 0 0}

/* ---- место ---- */
.place-name{margin:26px 0 0;font-size:24px;letter-spacing:3px;color:var(--muted)}
.collage{
  margin-top:38px;border-radius:14px;overflow:hidden;
  box-shadow:0 26px 60px rgba(160,100,120,.25);
  font-size:0;
}
.collage img{width:100%;aspect-ratio:4/3;object-fit:cover}

.buttons{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:16px}
.btn{
  display:block;width:100%;padding:16px 28px;
  border-radius:40px;text-decoration:none;
  font-family:'Cormorant Garamond', Georgia, serif;
  font-size:17px;letter-spacing:2px;
  transition:.3s ease;
}
.btn-main{background:var(--accent);color:#fff;box-shadow:0 16px 34px rgba(199,126,149,.3)}
.btn-main:hover{background:#B5677F}
.btn-soft{background:var(--accent-soft);color:var(--ink);box-shadow:0 16px 34px rgba(199,126,149,.2)}
.btn-soft:hover{transform:translateY(-3px)}

/* ---- программа / dress code / с собой ---- */
.lines{margin:30px 0 0;padding:0;list-style:none}
.lines li{font-size:20px;letter-spacing:2px;color:var(--muted);margin:16px 0}
.sub{font-size:20px;letter-spacing:2px;color:var(--muted);margin:26px 0 0}
.gap{margin-top:64px}

/* ---- низ ---- */
footer{padding:0 22px 80px;text-align:center}
footer a{
  font-size:15px;letter-spacing:3px;color:var(--muted);text-decoration:none;
  border-bottom:1px solid var(--accent-soft);padding-bottom:5px;transition:.3s ease;
}
footer a:hover{color:var(--ink);border-color:var(--accent)}

@media (max-width:480px){
  section{padding:64px 20px}
  .hero{padding-top:90px}
  .hero h1{font-size:58px}
  h2{font-size:28px}
  .countdown{gap:14px}
  .countdown div{padding:22px 16px}
  .countdown span{font-size:30px}
  .countdown p{font-size:14px;letter-spacing:2px}
  .lines li,.sub{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="stage" id="stage">
    <div class="letter" id="letter" aria-hidden="true"><span id="letter-name"></span></div>
    <button id="envelope" aria-label="Открыть приглашение"><img id="envelope-img" alt=""></button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<main id="page" hidden>

  <div class="music-bar">
    <button id="music-toggle" type="button" aria-pressed="false"></button>
  </div>

  <section class="hero reveal">
    <div class="wrap">
      <h1 id="name"></h1>
      <img class="hero-img" id="hero-photo" alt="">
      <p class="occasion" id="occasion"></p>
      <p class="date" id="date"></p>
    </div>
  </section>

  <section class="tone reveal">
    <div class="wrap">
      <h2 id="countdown-title"></h2>
      <div class="countdown" id="countdown">
        <div><span id="d">00</span><p id="l-d"></p></div>
        <div><span id="h">00</span><p id="l-h"></p></div>
        <div><span id="m">00</span><p id="l-m"></p></div>
        <div><span id="s">00</span><p id="l-s"></p></div>
      </div>
    </div>
  </section>

  <section class="reveal">
    <div class="wrap">
      <h2 id="place-title"></h2>
      <p class="place-name" id="place-name"></p>
      <div class="collage" id="collage"></div>
      <div class="buttons">
        <a class="btn btn-main" id="map-btn" target="_blank" rel="noopener noreferrer"></a>
        <a class="btn btn-soft" id="chat-btn" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
  </section>

  <section class="tone reveal">
    <div class="wrap">
      <h2 id="program-title"></h2>
      <ul class="lines" id="program"></ul>
    </div>
  </section>

  <section class="reveal">
    <div class="wrap">
      <h2 id="dress-title"></h2>
      <ul class="lines" id="dress"></ul>
      <h2 class="gap" id="bring-title"></h2>
      <p class="sub" id="bring-text"></p>
    </div>
  </section>

  <footer class="reveal">
    <a id="site-link" target="_blank" rel="noopener noreferrer"></a>
  </footer>

</main>

<audio id="bg-music" loop preload="auto"></audio>

<script>
(function () {
  'use strict';
  var C = CONTENT;
  var $ = function (id) { return document.getElementById(id); };
  var set = function (id, v) { $(id).textContent = v; };
  var li = function (host, text) {
    var el = document.createElement('li'); el.textContent = text; host.appendChild(el);
  };

  /* ---------- тексты ---------- */
  $('envelope-img').src = C.envelope;
  set('letter-name', C.name);
  set('hint', C.envelopeHint);

  set('name', C.name);
  $('hero-photo').src = C.heroPhoto;
  $('hero-photo').alt = C.name;
  $('hero-photo').addEventListener('error', function () { this.removeAttribute('src'); });
  set('occasion', C.occasion);
  set('date', C.dateLine);

  set('countdown-title', C.countdownTitle);
  set('l-d', C.countdownLabels.days);
  set('l-h', C.countdownLabels.hours);
  set('l-m', C.countdownLabels.minutes);
  set('l-s', C.countdownLabels.seconds);

  set('place-title', C.placeTitle);
  set('place-name', C.placeName);
  var collage = $('collage');
  C.placePhotos.forEach(function (src) {
    var img = document.createElement('img');
    img.alt = C.placeName;
    img.addEventListener('error', function () { this.remove(); });
    img.src = src;
    collage.appendChild(img);
  });
  set('map-btn', C.mapButton);  $('map-btn').href = C.mapUrl;
  set('chat-btn', C.chatButton); $('chat-btn').href = C.chatUrl;

  set('program-title', C.programTitle);
  C.program.forEach(function (row) { li($('program'), row); });

  set('dress-title', C.dressTitle);
  C.dressLines.forEach(function (row) { li($('dress'), row); });
  set('bring-title', C.bringTitle);
  set('bring-text', C.bringText);

  set('site-link', C.siteLabel);
  $('site-link').href = C.siteUrl;

  var audio = $('bg-music');
  audio.src = C.musicFile;

  /* ---------- отсчёт ---------- */
  var target = new Date(C.countdownTarget).getTime();
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var timer = setInterval(tick, 1000);
  function tick() {
    var left = target - Date.now();
    if (left <= 0) {
      clearInterval(timer);
      var box = $('countdown');
      box.className = '';
      box.textContent = '';
      var p = document.createElement('p');
      p.className = 'countdown-done';
      p.textContent = C.countdownDone;
      box.appendChild(p);
      return;
    }
    var sec = Math.floor(left / 1000);
    set('d', pad(Math.floor(sec / 86400)));
    set('h', pad(Math.floor(sec / 3600) % 24));
    set('m', pad(Math.floor(sec / 60) % 60));
    set('s', pad(sec % 60));
  }
  tick();

  /* ---------- появление блоков ---------- */
  function reveal() {
    var items = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -8% 0px' });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });
  }

  /* ---------- музыка ---------- */
  var toggle = $('music-toggle');
  function ui(on) {
    toggle.textContent = on ? C.musicOn : C.musicOff;
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  ui(false);
  function play() {
    var p = audio.play();
    if (p && p.then) { p.then(function () { ui(true); }).catch(function () { ui(false); }); }
  }
  toggle.addEventListener('click', function () {
    if (audio.paused) { play(); } else { audio.pause(); ui(false); }
  });
  audio.addEventListener('play',  function () { ui(true); });
  audio.addEventListener('pause', function () { ui(false); });

  /* ---------- открытие ---------- */
  var envelope = $('envelope'), gate = $('gate'), page = $('page');
  var stage = $('stage'), letter = $('letter'), opened = false;

  envelope.addEventListener('click', function () {
    if (opened) return;
    opened = true;

    play();                                   /* музыка — строго в момент клика */

    /* во сколько раз увеличить карточку, чтобы накрыть экран */
    var r = letter.getBoundingClientRect();
    var k = Math.max(window.innerWidth / r.width, window.innerHeight / r.height) * 1.25;
    stage.style.setProperty('--k', k.toFixed(2));

    stage.classList.add('shake');             /* 0.00s — покачивание */
    gate.classList.add('fading');

    setTimeout(function () {                  /* 0.38s — открытка выезжает вверх */
      stage.classList.add('slide');
    }, 380);

    setTimeout(function () {                  /* 0.55s — конверт уезжает вниз */
      stage.classList.add('drop');
    }, 550);

    setTimeout(function () {                  /* 1.05s — карточка накрывает экран */
      stage.classList.add('expand');
      page.hidden = false;
      document.body.classList.remove('locked');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { page.classList.add('visible'); reveal(); });
      });
    }, 1050);

    setTimeout(function () {                  /* 1.50s — стартовый экран гаснет */
      gate.classList.add('opened');
    }, 1500);

    setTimeout(function () { gate.remove(); }, 2100);
  });
})();
</script>
</body>
</html>
