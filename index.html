<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erkezhan</title>
<meta name="theme-color" content="#FBEFF2">
<meta name="description" content="Приглашение на день рождения. 4 октября 2026, 18:00–21:00.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ==========================================================
     ВСЁ, ЧТО МОЖНО МЕНЯТЬ — ТОЛЬКО В ЭТОМ БЛОКЕ
     Тексты, ссылки, дата, фотографии.
     ========================================================== -->
<script>
const CONTENT = {

  /* --- Стартовый экран: картинка конверта --- */
  envelope: "images/envelope.png",
  envelopeHint: "нажмите, чтобы открыть",

  /* --- Музыка --- */
  musicFile: "music/dancing-queen.mp3",
  musicOn:  "Музыка: ВКЛ",
  musicOff: "Музыка: ВЫКЛ",

  /* --- Шапка --- */
  name: "Erkezhan",
  heroPhoto: "images/hero.jpg",     /* фото 16:9 */
  occasion: "День рождения",
  dateLine: "4 октября 2026 • 18:00–21:00",

  /* --- Обратный отсчёт --- */
  countdownTitle: "До праздника осталось",
  /* формат: год-месяц-деньTчасы:минуты+05:00 (Астана) */
  countdownTarget: "2026-10-04T18:00:00+05:00",
  countdownDone: "Уже начали",
  countdownLabels: { days: "дней", hours: "часов", minutes: "минут", seconds: "секунд" },

  /* --- Место проведения --- */
  placeTitle: "Место проведения",
  placeName: "[НАЗВАНИЕ МЕСТА]",
  /* фото места — идут друг под другом одним коллажем.
     Можно добавлять и убирать строки; ненайденные файлы просто не покажутся */
  placePhotos: [
    "images/place1.jpg",
    "images/place2.jpg",
    "images/place3.jpg"
  ],
  mapButton: "Открыть в 2GIS",
  mapUrl: "https://2gis.kz/astana/geo/70000001080819861",
  chatButton: "Чат",
  chatUrl: "[ССЫЛКА НА ЧАТ]",

  /* --- Программа --- */
  programTitle: "Программа",
  program: [
    "18:00 • Собираемся",
    "19:00 • Мастер-класс по рисованию",
    "21:00 • Расходимся"
  ],

  /* --- Dress Code --- */
  dressTitle: "Dress Code",
  dressLines: [
    "Total white • Любой фасон"
  ],

  /* --- С собой --- */
  bringTitle: "С собой",
  bringText: "Хорошее настроение и улыбку :)",

  /* --- Ссылка внизу --- */
  siteLabel: "Мой сайт",
  siteUrl: "[ССЫЛКА НА САЙТ]"
};
</script>
<!-- ===================== КОНЕЦ НАСТРОЕК ===================== -->

<style>
:root{
  --base:#FFC3CF;         /* средний тон обоев — виден до загрузки картинок */
  --rose:#FFC3CF;
  --line:#E788A2;         /* цвет взят с IMG_8908 */
  --accent:#C0687E;       /* самый насыщенный тон с IMG_8908 */
  --accent-soft:#FFD5CA;  /* тёплый персиковый с IMG_8907 */
  --accent:#A0526E;       /* тёмно-розовый: кнопка 2GIS */
  --accent-soft:#EFC5D2;  /* светло-розовый: кнопка «Чат» */
  --ink:#1A1115;          /* заголовки */
  --text:#2A1C21;         /* основной текст */
  --muted:#4A3239;        /* мелкие подписи */
  --on-dark:#FFF5F7;      /* текст на тёмном фоне */
  --head:'Unbounded', system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html{background:#FFC3CF}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  font-weight:400;
  position:relative;
  background:var(--base);
  color:var(--text);
  text-align:center;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden;height:100svh}
img{display:block;max-width:100%}

h1,h2{font-family:var(--head);letter-spacing:-0.01em;text-transform:uppercase;margin:0;color:var(--ink)}
h2{font-size:26px;font-weight:600;line-height:1.25}


/* ============ ФОН: ОБОИ IMG_8907 / IMG_8908 ============ */
/* один слой на всю высоту документа, обе картинки перетекают друг в друга */
.bg{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:-2;overflow:hidden;background:var(--base);pointer-events:none;
}
.bg span{
  position:absolute;left:0;right:0;display:block;
  background-repeat:no-repeat;
  background-position:center;
  background-size:cover;          /* пропорции не тянутся */
}
/* верхняя половина */
.bg .top{
  top:0;height:62%;
  background-image:url("images/IMG_8907.jpg");
}
/* нижняя половина: заходит на верхнюю и растворяется — шва не видно */
.bg .bottom{
  top:38%;bottom:0;
  background-image:url("images/IMG_8908.jpg");
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 26%);
          mask-image:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 26%);
}

/* стекло */
.glass{
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.55);
}

/* ================== КОНВЕРТ ================== */
#gate{
  position:fixed;inset:0;z-index:50;
  background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:30px;padding:28px;
  transition:opacity .6s ease, visibility .6s;
}
#gate.opened{opacity:0;visibility:hidden;pointer-events:none}
.stage{position:relative;width:min(76vw,340px);background:transparent;border:0;box-shadow:none}

#envelope{
  position:relative;z-index:2;
  border:0;padding:0;margin:0;background:transparent;cursor:pointer;
  width:100%;line-height:0;
  -webkit-appearance:none;appearance:none;
  box-shadow:none;border-radius:0;
  -webkit-tap-highlight-color:transparent;
  animation:pulse 3s ease-in-out infinite;
  will-change:transform,opacity;
  /* тень повторяет контур конверта, а не прямоугольник картинки */
  filter:drop-shadow(0 18px 26px rgba(160,100,120,.28));
}
#envelope img{
  width:100%;height:auto;display:block;
  background:transparent;border:0;border-radius:0;box-shadow:none;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
#envelope:focus-visible{outline:1px solid var(--accent);outline-offset:16px}

/* по клику конверт просто исчезает */
.stage.away #envelope{animation:none;opacity:0;transition:opacity .3s ease}

#gate.fading .hint{opacity:0;transition:opacity .35s ease}
.hint{
  font-family:var(--body);font-weight:500;text-transform:uppercase;
  font-size:12px;letter-spacing:0.15em;color:var(--muted);margin:0;
  animation:fadeHint 3s ease-in-out infinite;
}
@keyframes fadeHint{0%,100%{opacity:.5}50%{opacity:1}}

/* ================== МУЗЫКА ================== */
.music-bar{padding:20px 22px 0}
#music-toggle{
  display:block;width:100%;max-width:430px;margin:0 auto;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  font-family:var(--body);font-weight:500;text-transform:uppercase;
  font-size:13px;letter-spacing:0.15em;color:var(--text);
  border:1px solid rgba(255,255,255,.55);border-radius:40px;
  padding:15px 24px;cursor:pointer;transition:.3s ease;
}
#music-toggle:hover{background:rgba(255,255,255,.5)}

/* ================== СТРАНИЦА ================== */
main{opacity:0;transition:opacity .8s ease}
main.visible{opacity:1}
main[hidden]{display:none}

section{padding:80px 22px;position:relative;background:transparent}
section + section::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(430px,calc(100% - 44px));height:1px;
  background:linear-gradient(90deg,transparent 0%, var(--line) 50%, transparent 100%);
}
.wrap{max-width:430px;margin:0 auto}
.tone{background:transparent}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ---- шапка ---- */
.hero{padding-top:110px;padding-bottom:80px}
.hero h1{
  font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;
  font-size:74px;line-height:1.05;letter-spacing:0;text-transform:none;
  background:linear-gradient(120deg,#B5657F 0%, #1A1115 62%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-img{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  margin-top:38px;border-radius:14px;
  background:rgba(255,255,255,.35);
  box-shadow:0 26px 60px rgba(160,100,120,.25);
}
.occasion{margin:34px 0 0;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:0.15em;color:var(--muted)}
.date{margin:14px 0 0;font-size:17px;font-weight:500;color:var(--text)}

/* ---- отсчёт ---- */
.countdown{display:flex;flex-direction:column;gap:18px;margin-top:40px}
.countdown div{
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.55);
  border-radius:14px;padding:26px 20px;
  box-shadow:0 14px 34px rgba(160,100,120,.12);
}
.countdown span{
  display:block;font-family:var(--head);font-weight:600;
  font-size:32px;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#C0687E 0%, #8E4059 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.countdown p{margin:12px 0 0;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.15em;color:var(--muted)}
.countdown-done{font-family:var(--head);font-weight:600;font-size:22px;text-transform:uppercase;letter-spacing:-0.01em;color:var(--ink);margin:38px 0 0}

/* ---- место ---- */
.place-name{margin:22px 0 0;font-size:17px;font-weight:500;color:var(--text)}
.collage{
  margin-top:38px;border-radius:14px;overflow:hidden;
  box-shadow:0 26px 60px rgba(160,100,120,.25);
  font-size:0;
}
.collage img{width:100%;height:auto;display:block}

.buttons{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:16px}
.btn{
  display:block;width:100%;padding:16px 28px;
  border-radius:40px;text-decoration:none;
  font-family:var(--body);font-weight:600;text-transform:uppercase;
  font-size:13px;letter-spacing:0.15em;
  transition:.3s ease;
}
.btn-main{background:linear-gradient(160deg,#E788A2 0%, #C0687E 100%);color:#FFF6F2;box-shadow:0 14px 30px rgba(192,104,126,.28)}
.btn-main:hover{filter:brightness(.94)}
.btn-soft{background:rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.55);color:var(--ink);box-shadow:0 14px 30px rgba(160,82,110,.12)}
.btn-soft:hover{transform:translateY(-3px)}

/* ---- программа / dress code / с собой ---- */
.lines{margin:30px 0 0;padding:0;list-style:none}
.lines li{font-size:17px;font-weight:400;color:var(--text);margin:16px 0}
.sub{font-size:17px;font-weight:400;color:var(--text);margin:22px 0 0}
.gap{margin-top:64px}

/* ---- низ ---- */
footer{padding:0 22px 80px;text-align:center}
footer a{
  font-family:var(--body);font-weight:500;text-transform:uppercase;
  font-size:13px;letter-spacing:0.15em;color:var(--text);text-decoration:none;
  border-bottom:1px solid var(--accent-soft);padding-bottom:5px;transition:.3s ease;
}
footer a:hover{color:var(--ink);border-color:var(--accent)}

@media (max-width:480px){
  section{padding:64px 20px}
  .hero{padding-top:90px}
  .hero h1{font-size:58px}
  h2{font-size:22px}
  .countdown{gap:14px}
  .countdown div{padding:22px 16px}
  .countdown span{font-size:28px}
  .countdown p{font-size:11px;letter-spacing:0.15em}
  .lines li,.sub{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}
</style>
<noscript><style>#gate{display:none}main[hidden]{display:block!important}main{opacity:1!important}.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body class="locked">

<div class="bg" aria-hidden="true"><span class="top"></span><span class="bottom"></span></div>

<div id="gate">
  <div class="stage" id="stage">
    <button id="envelope" aria-label="Открыть приглашение"><img id="envelope-img" alt=""></button>
  </div>
  <p class="hint" id="hint"></p>
</div>

<main id="page" hidden>

  <div class="music-bar">
    <button id="music-toggle" type="button" aria-pressed="false"></button>
  </div>

  <section class="hero reveal">
    <div class="wrap">
      <h1 id="name"></h1>
      <img class="hero-img" id="hero-photo" alt="">
      <p class="occasion" id="occasion"></p>
      <p class="date" id="date"></p>
    </div>
  </section>

  <section class="tone reveal">
    <div class="wrap">
      <h2 id="countdown-title"></h2>
      <div class="countdown" id="countdown">
        <div><span id="d">00</span><p id="l-d"></p></div>
        <div><span id="h">00</span><p id="l-h"></p></div>
        <div><span id="m">00</span><p id="l-m"></p></div>
        <div><span id="s">00</span><p id="l-s"></p></div>
      </div>
    </div>
  </section>

  <section class="reveal">
    <div class="wrap">
      <h2 id="place-title"></h2>
      <p class="place-name" id="place-name"></p>
      <div class="collage" id="collage"></div>
      <div class="buttons">
        <a class="btn btn-main" id="map-btn" target="_blank" rel="noopener noreferrer"></a>
        <a class="btn btn-soft" id="chat-btn" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
  </section>

  <section class="tone reveal">
    <div class="wrap">
      <h2 id="program-title"></h2>
      <ul class="lines" id="program"></ul>
    </div>
  </section>

  <section class="reveal">
    <div class="wrap">
      <h2 id="dress-title"></h2>
      <ul class="lines" id="dress"></ul>
      <h2 class="gap" id="bring-title"></h2>
      <p class="sub" id="bring-text"></p>
    </div>
  </section>

  <footer class="reveal">
    <a id="site-link" target="_blank" rel="noopener noreferrer"></a>
  </footer>

</main>

<audio id="bg-music" loop preload="auto"></audio>

<script>
(function () {
  'use strict';
  var C = CONTENT;
  var $ = function (id) { return document.getElementById(id); };
  var set = function (id, v) { $(id).textContent = v; };
  var li = function (host, text) {
    var el = document.createElement('li'); el.textContent = text; host.appendChild(el);
  };

  /* ---------- тексты ---------- */
  $('envelope-img').src = C.envelope;
  set('hint', C.envelopeHint);

  set('name', C.name);
  $('hero-photo').src = C.heroPhoto;
  $('hero-photo').alt = C.name;
  $('hero-photo').addEventListener('error', function () { this.removeAttribute('src'); });
  set('occasion', C.occasion);
  set('date', C.dateLine);

  set('countdown-title', C.countdownTitle);
  set('l-d', C.countdownLabels.days);
  set('l-h', C.countdownLabels.hours);
  set('l-m', C.countdownLabels.minutes);
  set('l-s', C.countdownLabels.seconds);

  set('place-title', C.placeTitle);
  set('place-name', C.placeName);
  var collage = $('collage');
  C.placePhotos.forEach(function (src) {
    var img = document.createElement('img');
    img.alt = C.placeName;
    img.addEventListener('error', function () { this.remove(); });
    img.src = src;
    collage.appendChild(img);
  });
  set('map-btn', C.mapButton);  $('map-btn').href = C.mapUrl;
  set('chat-btn', C.chatButton); $('chat-btn').href = C.chatUrl;

  set('program-title', C.programTitle);
  C.program.forEach(function (row) { li($('program'), row); });

  set('dress-title', C.dressTitle);
  C.dressLines.forEach(function (row) { li($('dress'), row); });
  set('bring-title', C.bringTitle);
  set('bring-text', C.bringText);

  set('site-link', C.siteLabel);
  $('site-link').href = C.siteUrl;

  var audio = $('bg-music');
  audio.src = C.musicFile;

  /* ---------- отсчёт ---------- */
  var target = new Date(C.countdownTarget).getTime();
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var timer = setInterval(tick, 1000);
  function tick() {
    var left = target - Date.now();
    if (left <= 0) {
      clearInterval(timer);
      var box = $('countdown');
      box.className = '';
      box.textContent = '';
      var p = document.createElement('p');
      p.className = 'countdown-done';
      p.textContent = C.countdownDone;
      box.appendChild(p);
      return;
    }
    var sec = Math.floor(left / 1000);
    set('d', pad(Math.floor(sec / 86400)));
    set('h', pad(Math.floor(sec / 3600) % 24));
    set('m', pad(Math.floor(sec / 60) % 60));
    set('s', pad(sec % 60));
  }
  tick();

  /* ---------- появление блоков ---------- */
  function reveal() {
    var items = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -8% 0px' });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });
  }

  /* ---------- музыка ---------- */
  var toggle = $('music-toggle');
  function ui(on) {
    toggle.textContent = on ? C.musicOn : C.musicOff;
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  ui(false);
  function play() {
    var p = audio.play();
    if (p && p.then) { p.then(function () { ui(true); }).catch(function () { ui(false); }); }
  }
  toggle.addEventListener('click', function () {
    if (audio.paused) { play(); } else { audio.pause(); ui(false); }
  });
  audio.addEventListener('play',  function () { ui(true); });
  audio.addEventListener('pause', function () { ui(false); });

  /* ---------- открытие ---------- */
  var envelope = $('envelope'), gate = $('gate'), page = $('page');
  var stage = $('stage'), opened = false;

  envelope.addEventListener('click', function () {
    if (opened) return;
    opened = true;

    play();                                   /* музыка — строго в момент клика */

    stage.classList.add('away');
    gate.classList.add('fading');
    gate.classList.add('opened');
    page.hidden = false;
    document.body.classList.remove('locked');
    requestAnimationFrame(function () {
      page.classList.add('visible');
      reveal();
    });

    setTimeout(function () { gate.remove(); }, 400);
  });
})();
</script>
</body>
</html>
