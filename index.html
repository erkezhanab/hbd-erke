<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erkezhan — приглашение</title>
<meta name="description" content="Приглашение на день рождения. 4 октября 2026, 18:00–21:00.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<!-- ==========================================================
     ВСЕ ТЕКСТЫ САЙТА — МЕНЯТЬ ТОЛЬКО ЗДЕСЬ
     ========================================================== -->
<script>
const CONTENT = {

  /* Имя крупно вверху */
  name: "Erkezhan",

  /* Фото. Положи файл в папку images/ и оставь это имя (или поменяй тут) */
  photo: "images/hero.jpg",

  /* Строка под фото */
  occasion: "день рождения",

  /* Дата и время одной строкой */
  dateLine: "4 октября 2026 • 18:00–21:00",

  /* Заголовок над обратным отсчётом */
  countdownTitle: "До праздника осталось",

  /* Дата, до которой идёт отсчёт. Формат: год-месяц-деньTчасы:минуты+05:00 (Астана) */
  countdownTarget: "2026-10-04T18:00:00+05:00",

  /* Текст, который появится, когда отсчёт дойдёт до нуля */
  countdownDone: "Уже начали",

  /* Подписи под цифрами отсчёта */
  countdownLabels: { days: "дней", hours: "часов", minutes: "минут", seconds: "секунд" },

  /* Программа вечера. Можно добавлять и убирать строки */
  programTitle: "Программа",
  program: [
    { time: "18:00", text: "собираемся" },
    { time: "19:00", text: "мастер-класс по рисованию (1.5–2 часа)" },
    { time: "21:00", text: "расходимся" }
  ],

  /* Место проведения */
  placeTitle: "Место проведения",
  placeName: "Астана",          /* <- впиши название заведения */
  placeAddress: "",             /* <- необязательно: улица, дом */
  mapButton: "Открыть в 2GIS",
  mapUrl: "https://2gis.kz/astana/geo/70000001080819861",

  /* Dress code */
  dressTitle: "Dress code",
  dressText: "[заполню сама]",

  /* С собой */
  bringTitle: "С собой",
  bringText: "хорошее настроение :)",

  /* Ссылка на основной сайт внизу */
  siteLabel: "Мой сайт",
  siteUrl: "[ССЫЛКА]",          /* <- вставь сюда адрес своего сайта */

  /* Экран с конвертом */
  envelopeHint: "нажми, чтобы открыть",

  /* Переключатель музыки */
  musicOn: "Музыка: ВКЛ",
  musicOff: "Музыка: ВЫКЛ",
  musicFile: "music/dancing-queen.mp3"
};
</script>
<!-- ======================= КОНЕЦ ТЕКСТОВ ======================= -->

<style>
:root{
  --bg:#FBEFF2;
  --accent:#E8A5B8;
  --ink:#3A2A2E;
  --muted:#8C7078;
  --line:#EBD6DC;
  --serif:'Cormorant Garamond', Georgia, serif;
  --sans:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.locked{overflow:hidden;height:100svh}
img{max-width:100%;display:block}

/* ---------- конверт ---------- */
#gate{
  position:fixed;inset:0;z-index:50;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;padding:24px;
  transition:opacity .6s ease, visibility .6s;
}
#gate.opened{opacity:0;visibility:hidden;pointer-events:none}

.envelope{
  --w:min(70vw,260px);
  width:var(--w);height:calc(var(--w)*.66);
  position:relative;border:0;padding:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.envelope:focus-visible{outline:1px solid var(--accent);outline-offset:14px}
.env-body{position:absolute;inset:0;background:#fff;border:1px solid var(--line)}
.env-letter{
  position:absolute;left:10%;right:10%;top:14%;height:78%;
  background:#fff;border:1px solid var(--line);z-index:2;
  transition:transform .7s cubic-bezier(.22,1,.36,1);
}
.env-pocket{
  position:absolute;inset:0;z-index:3;background:#FDF6F8;border:1px solid var(--line);
  clip-path:polygon(0 26%,50% 74%,100% 26%,100% 100%,0 100%);
}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:50%;z-index:4;
  background:#FDF6F8;border:1px solid var(--line);border-bottom:0;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top center;
  transition:transform .6s cubic-bezier(.6,-0.15,.4,1.2), z-index 0s .3s;
}
.env-line{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  z-index:5;width:34px;height:1px;background:var(--accent);
  transition:opacity .3s ease;
}
.envelope.open{animation:none}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.envelope.open .env-line{opacity:0}
.envelope.open .env-letter{transform:translateY(-52%)}
.envelope.fade{transition:opacity .45s ease .1s;opacity:0}

.hint{
  font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--muted);margin:0;
}

/* ---------- музыка ---------- */
#music-toggle{
  position:fixed;top:14px;right:14px;z-index:40;display:none;
  font-family:var(--sans);font-weight:400;
  font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);background:rgba(255,255,255,.75);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;cursor:pointer;transition:color .25s ease,border-color .25s ease;
}
#music-toggle.show{display:block}
#music-toggle.on{color:var(--ink);border-color:var(--accent)}

/* ---------- страница ---------- */
main{
  max-width:400px;margin:0 auto;
  padding:78px 26px 96px;
  opacity:0;transition:opacity .7s ease;
}
main.visible{opacity:1}
main[hidden]{display:none}

section{padding:56px 0;border-bottom:1px solid var(--line);text-align:center}
section:first-of-type{padding-top:0}
section:last-of-type{border-bottom:0}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

h1{
  font-family:var(--serif);font-weight:300;
  font-size:clamp(2.9rem,13vw,3.9rem);line-height:1.05;
  margin:0 0 30px;letter-spacing:.01em;
}
h2{
  font-family:var(--sans);font-weight:400;
  font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--muted);margin:0 0 26px;
}

.hero-img{
  width:100%;aspect-ratio:4/5;object-fit:cover;
  background:#F5E3E8;border:1px solid var(--line);
}
.occasion{
  font-family:var(--serif);font-style:italic;font-weight:300;
  font-size:1.5rem;color:var(--accent);margin:26px 0 0;
}
.date{
  font-family:var(--sans);font-weight:300;
  font-size:.86rem;letter-spacing:.1em;color:var(--ink);margin:12px 0 0;
}

/* отсчёт */
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.countdown div{padding:0 2px}
.countdown span{
  display:block;font-family:var(--serif);font-weight:300;
  font-size:clamp(1.9rem,9vw,2.4rem);line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.countdown p{
  font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:10px 0 0;
}
.countdown-done{font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--accent);margin:0}

/* программа */
.program{list-style:none;margin:0;padding:0;display:grid;gap:20px;text-align:left}
.program li{display:grid;grid-template-columns:62px 1fr;align-items:baseline;gap:14px}
.program .t{
  font-family:var(--serif);font-size:1.15rem;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.program .d{font-size:.86rem;line-height:1.5;color:var(--ink)}

/* место */
.place{font-family:var(--serif);font-size:1.5rem;font-weight:300;margin:0}
.place-addr{font-size:.78rem;color:var(--muted);margin:8px 0 0;letter-spacing:.04em}
.btn{
  display:inline-block;margin-top:24px;
  font-family:var(--sans);font-weight:400;
  font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);text-decoration:none;
  border:1px solid var(--accent);border-radius:999px;
  padding:13px 26px;transition:background-color .3s ease,color .3s ease;
}
.btn:hover{background:var(--accent);color:#fff}

.simple{font-family:var(--serif);font-size:1.3rem;font-weight:300;margin:0;line-height:1.5}
.gap{margin-top:46px}

footer{padding:40px 0 0;text-align:center}
footer a{
  font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px;
  transition:color .3s ease,border-color .3s ease;
}
footer a:hover{color:var(--ink);border-color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}
</style>
</head>
<body class="locked">

<div id="gate">
  <button class="envelope" id="envelope" aria-label="Открыть приглашение">
    <span class="env-body"></span>
    <span class="env-letter"></span>
    <span class="env-pocket"></span>
    <span class="env-flap"></span>
    <span class="env-line"></span>
  </button>
  <p class="hint" id="hint"></p>
</div>

<button id="music-toggle" type="button" aria-pressed="false"></button>

<main id="page" hidden>

  <section class="reveal">
    <h1 id="name"></h1>
    <img class="hero-img" id="photo" alt="">
    <p class="occasion" id="occasion"></p>
    <p class="date" id="date"></p>
  </section>

  <section class="reveal">
    <h2 id="countdown-title"></h2>
    <div class="countdown" id="countdown">
      <div><span id="d">00</span><p id="l-d"></p></div>
      <div><span id="h">00</span><p id="l-h"></p></div>
      <div><span id="m">00</span><p id="l-m"></p></div>
      <div><span id="s">00</span><p id="l-s"></p></div>
    </div>
  </section>

  <section class="reveal">
    <h2 id="program-title"></h2>
    <ul class="program" id="program"></ul>
  </section>

  <section class="reveal">
    <h2 id="place-title"></h2>
    <p class="place" id="place-name"></p>
    <p class="place-addr" id="place-addr"></p>
    <a class="btn" id="map-btn" target="_blank" rel="noopener noreferrer"></a>
  </section>

  <section class="reveal">
    <h2 id="dress-title"></h2>
    <p class="simple" id="dress-text"></p>
    <h2 class="gap" id="bring-title"></h2>
    <p class="simple" id="bring-text"></p>
  </section>

  <footer class="reveal">
    <a id="site-link" target="_blank" rel="noopener noreferrer"></a>
  </footer>

</main>

<audio id="bg-music" loop preload="auto"></audio>

<script>
(function () {
  'use strict';
  var C = CONTENT;
  var $ = function (id) { return document.getElementById(id); };
  var set = function (id, v) { $(id).textContent = v; };

  /* ---------- подстановка текстов ---------- */
  set('hint', C.envelopeHint);
  set('name', C.name);
  $('photo').src = C.photo;
  $('photo').alt = C.name;
  // пока фото не положено в images/ — показываем пустой розовый прямоугольник
  $('photo').addEventListener('error', function () { this.removeAttribute('src'); });
  set('occasion', C.occasion);
  set('date', C.dateLine);

  set('countdown-title', C.countdownTitle);
  set('l-d', C.countdownLabels.days);
  set('l-h', C.countdownLabels.hours);
  set('l-m', C.countdownLabels.minutes);
  set('l-s', C.countdownLabels.seconds);

  set('program-title', C.programTitle);
  var list = $('program');
  C.program.forEach(function (row) {
    var li = document.createElement('li');
    var t = document.createElement('span'); t.className = 't'; t.textContent = row.time;
    var d = document.createElement('span'); d.className = 'd'; d.textContent = row.text;
    li.appendChild(t); li.appendChild(d); list.appendChild(li);
  });

  set('place-title', C.placeTitle);
  set('place-name', C.placeName);
  if (C.placeAddress) { set('place-addr', C.placeAddress); } else { $('place-addr').remove(); }
  set('map-btn', C.mapButton);
  $('map-btn').href = C.mapUrl;

  set('dress-title', C.dressTitle);
  set('dress-text', C.dressText);
  set('bring-title', C.bringTitle);
  set('bring-text', C.bringText);

  set('site-link', C.siteLabel);
  $('site-link').href = C.siteUrl;

  var audio = $('bg-music');
  audio.src = C.musicFile;

  /* ---------- обратный отсчёт ---------- */
  var target = new Date(C.countdownTarget).getTime();
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var timer = setInterval(tick, 1000);

  function tick() {
    var left = target - Date.now();
    if (left <= 0) {
      clearInterval(timer);
      var box = $('countdown');
      box.className = '';
      box.innerHTML = '';
      var p = document.createElement('p');
      p.className = 'countdown-done';
      p.textContent = C.countdownDone;
      box.appendChild(p);
      return;
    }
    var sec = Math.floor(left / 1000);
    set('d', pad(Math.floor(sec / 86400)));
    set('h', pad(Math.floor(sec / 3600) % 24));
    set('m', pad(Math.floor(sec / 60) % 60));
    set('s', pad(sec % 60));
  }
  tick();

  /* ---------- появление блоков ---------- */
  function reveal() {
    var items = document.querySelectorAll('.reveal');
    if (!('IntersectionObserver' in window)) {
      Array.prototype.forEach.call(items, function (el) { el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });
  }

  /* ---------- музыка ---------- */
  var toggle = $('music-toggle');
  function ui(on) {
    toggle.textContent = on ? C.musicOn : C.musicOff;
    toggle.classList.toggle('on', on);
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  ui(false);

  function play() {
    var p = audio.play();
    if (p && p.then) { p.then(function () { ui(true); }).catch(function () { ui(false); }); }
  }
  toggle.addEventListener('click', function () {
    if (audio.paused) { play(); } else { audio.pause(); ui(false); }
  });
  audio.addEventListener('play', function () { ui(true); });
  audio.addEventListener('pause', function () { ui(false); });

  /* ---------- открытие конверта ---------- */
  var envelope = $('envelope'), gate = $('gate'), page = $('page'), opened = false;
  envelope.addEventListener('click', function () {
    if (opened) return;
    opened = true;

    play();                                  // строго внутри обработчика клика
    envelope.classList.add('open');
    toggle.classList.add('show');

    setTimeout(function () { envelope.classList.add('fade'); }, 620);

    setTimeout(function () {
      gate.classList.add('opened');
      page.hidden = false;
      document.body.classList.remove('locked');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { page.classList.add('visible'); reveal(); });
      });
    }, 900);

    setTimeout(function () { gate.remove(); }, 1700);
  });
})();
</script>
</body>
</html>
